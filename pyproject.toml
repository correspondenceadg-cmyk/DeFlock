[project]
name = "deflock"
version = "0.0.1"
description = "A game about how rules become cages"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer",
    "kivy>=2.3.1,<3.0.0",
]

[project.scripts]
deflock = "deflock:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deflock*"]

[tool.setuptools.package-data]
deflock = [
    "assets/*.png",
    "fonts/*.ttf",
]

[tool.uv.sources]
ksp-bootstraps = { git = "https://github.com/kivy-school/ksp-bootstraps", branch = "master" }

[dependency-groups]
dev = [
    "ksp-bootstraps",
    "ksproject",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.pip]
extra-index-url = [
    "https://pypi-index.psychowaspx.workers.dev/simple",
    "https://pypi.anaconda.org/kivyschool/simple"
]

#### kivy-school configuration ####

[tool.kivy-school]
app_name = "DeFlock"
bootstrap = "kivy"

[tool.kivy-school.android]
package_name = "ws.tilda.sentryprotocol.deflock"
version_name = "0.0.1"
version_code = 1
icon = "deflock_icon.png"
presplash = "presplash.png"
presplash_color = "#0f0a07"

archs = ["arm64-v8a"]
gradle_dependencies = []
gradle_plugins = []
permissions = []

api = 36
min_api = 28
sdk = "36"
ndk = "28c"
ndk_api = 28

global_tools = true
byte_compile_python = true
